<script>
function openForm(productName) {
  document.getElementById("productName").value = productName;
  document.getElementById("orderPopup").style.display = "block";
}
function closeForm() {
  document.getElementById("orderPopup").style.display = "none";
}
function sendToWhatsApp(event) {
  event.preventDefault();
  var name = document.querySelector('input[name="name"]').value;
  var mobile = document.querySelector('input[name="phone"]').value;
  var address = document.querySelector('textarea[name="address"]').value;
  var qty = document.querySelector('select[name="quantity"]').value;
  var product = document.querySelector('input[name="product"]').value;
  
  var message = `*নতুন অর্ডার*%0A%0A*প্রোডাক্ট:* ${product}%0A*নাম:* ${name}%0A*মোবাইল:* ${mobile}%0A*ঠিকানা:* ${address}%0A*পরিমান:* ${qty} পিস`;
  window.open(`https://wa.me/8801328584095?text=${message}`, '_blank');
  closeForm();
}
</script>
