.price { color: #f57224; font-weight: bold; font-size: 15px; }
.msg-btn { background: #25D366; color: white; border: none; width: 100%; padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
